name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Assets are uploaded directly to the GitHub release from each build job —
# release assets do not count against the org's Actions artifact storage
# quota (which actions/upload-artifact hit).

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_is_draft=$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')
            if [ "$release_is_draft" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME already exists and is not a draft"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
            echo "deleted incomplete draft release $GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cfdrop $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --draft

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: cfdrop-linux-amd64
          - target: aarch64-unknown-linux-musl
            asset: cfdrop-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Test (host arch)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross test --target ${{ matrix.target }}
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')
          if [ "$release_is_draft" != "true" ]; then
            echo "::error::refusing to upload assets to a published release"
            exit 1
          fi
          tar -czf "${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" cfdrop
          sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"

  macos:
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test, build, upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test
          cargo build --release
          tar -czf cfdrop-macos-arm64.tar.gz -C target/release cfdrop
          RELEASE_METADATA=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["id"], str(r["draft"]).lower())')
          read -r RELEASE_ID RELEASE_IS_DRAFT <<< "$RELEASE_METADATA"
          if [ "$RELEASE_IS_DRAFT" != "true" ]; then
            echo "::error::refusing to upload macOS asset to a published release"
            exit 1
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @cfdrop-macos-arm64.tar.gz \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=cfdrop-macos-arm64.tar.gz" \
            -o /dev/null
          echo "uploaded cfdrop-macos-arm64.tar.gz to release $RELEASE_ID"

  publish-release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')
          if [ "$release_is_draft" != "true" ]; then
            echo "::error::release must remain a draft until verification succeeds"
            exit 1
          fi
          release_assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          printf '%s\n' "$release_assets"
          for required_asset in \
            cfdrop-linux-amd64.tar.gz \
            cfdrop-linux-amd64.tar.gz.sha256 \
            cfdrop-linux-arm64.tar.gz \
            cfdrop-linux-arm64.tar.gz.sha256 \
            cfdrop-macos-arm64.tar.gz
          do
            if ! grep -Fxq "$required_asset" <<< "$release_assets"; then
              echo "::error::missing release asset: $required_asset"
              exit 1
            fi
          done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
